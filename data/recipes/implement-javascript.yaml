name: implement-javascript
description: >
  Implement JavaScript/TypeScript backend code (Node.js services, APIs, CLIs)
  with emphasis on readability, security, performance, and maintainability.
  Write idiomatic modern JavaScript following ES module and async best practices.

compose:
