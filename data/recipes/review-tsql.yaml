name: review-tsql
description: >
  Review T-SQL with attention to query performance (execution plans, indexing,
  SARGability), security (injection, parameterization), and correctness (NULL
  handling, transactions). Identify issues and suggest concrete improvements.

compose:
  - base/lifecycle/code-reviewer
  - base/layer/database-specialist
  - language-specific/tsql/tsql-developer

mixins:
  - performance-focused
  - readability-focused
  - security-aware
  - language-specific/tsql/tsql-formatting-standards
