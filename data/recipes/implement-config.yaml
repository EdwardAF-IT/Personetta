name: implement-config
description: >
  Author and edit schema-governed configuration files — IaC, Kubernetes/Helm
  manifests, OpenAPI specs, CI/CD workflows, and tool definitions — with emphasis
  on schema conformance, idempotency, minimal diffs, and validation before done.

compose:
  - base/lifecycle/implementation-developer
  - base/layer/configuration-author

mixins:
  - readability-focused
  - maintainability-focused
