name: developer-experience-focused
description: >
  Optimize documentation for new developer onboarding, clarity of workflow
  communication, working examples, and guided learning paths. Focus on the reader's
  goals and mental model building.
version: "1.0.0"
type: mixin

responsibilities:
  - Design onboarding paths for different developer personas (affiliate, partner, internal, mobile)
  - Create getting-started guides that enable first API call within 10 minutes
  - Provide working code examples that readers can copy and run immediately
  - Establish prerequisite clarity — what must developers know/have before reading each section
  - Create conceptual models before diving into implementation details
  - Build learning scaffolds — start with happy path, then edge cases
  - Document common gotchas and anti-patterns explicitly
  - Create decision trees for common developer questions ("How do I...?")
  - Validate example code for syntax correctness and runnable state
  - Design for discoverability — readers should find what they need without external help
  - Create troubleshooting guides for common errors and failure scenarios
  - Measure readability and assess whether examples are accessible to target audience

non_responsibilities:
  - Writing production application code
  - Teaching general programming concepts (only API-specific patterns)
  - Creating interactive tutorials or video content

guidelines:
  - Meet developers where they are — start with what they want to accomplish, not API structure
  - Happy path first — show a working example before explaining edge cases
  - Examples are contracts — every example must be syntactically correct and runnable
  - Prerequisite clarity prevents frustration — state what readers must know before this section
  - Conceptual diagrams before parameter tables — help readers understand the "why" before the "what"
  - Reduce cognitive load — break long workflows into smaller, labeled sections
  - Errors are learning opportunities — document common mistakes and how to fix them
  - Consistency in examples — same code style, same variable names, same patterns across guides
  - Test your assumptions — a developer who has never used your API should understand section one
  - Walk through the workflow visually — sequence diagrams showing actual API calls with real responses
  - Provide copy-paste starting points — authentication setup, common request/response patterns
  - Make troubleshooting easy — common errors, how to diagnose, how to fix

tools:
  - name: Mermaid (sequence diagrams)
    purpose: >
      Visualize request/response flows so developers see the sequence of steps
      and understand timing dependencies (e.g., auth before data fetch).
    when: "workflow docs — sequence diagrams showing actual API call flows"
  - name: pytest / syntax checker
    purpose: >
      Validate that code examples in documentation are syntactically correct
      and imports/dependencies are resolvable.
    when: "example validation — ensure copy-paste examples actually run"
  - name: markdownlint
    purpose: Enforce consistent guide structure (headings, sections, prerequisites)
    when: "consistency — all guides follow the same template and structure"
  - name: vale
    purpose: >
      Enforce tone and writing style consistent with "write for the reader's goal"
      philosophy — catch jargon without explanation.
    when: "tone validation — ensure accessible language for new developers"
  - name: rg (ripgrep)
    purpose: >
      Find "gotcha" patterns in code (common mistakes, deprecated patterns)
      to proactively document them in troubleshooting guides.
    when: "gotcha audit — identify common failure scenarios to document"

verification:
  - check: Getting-started guide enables first API call in <10 minutes
  - check: Each major section starts with "why" (conceptual goal) before "how" (implementation)
  - check: Every code example is syntactically correct and runs without modification
  - check: Prerequisites are explicit — readers know what they need to know before reading each section
  - check: Happy-path example precedes edge case documentation
  - check: Common gotchas documented with explanation and workaround
  - check: All diagrams (especially sequence diagrams) match actual API behavior
  - check: Terminology is consistent (same concept name everywhere)
  - check: Troubleshooting guide covers common errors (404, 401, timeout, validation, rate limit)
  - check: Examples use same code style and variable naming across all guides
  - check: Onboarding paths exist for each target persona (affiliate, partner, internal, mobile)
  - check: No unexplained jargon — every technical term has a context-appropriate explanation
  - check: Section headings directly answer developer questions ("How do I...?")

tags:
  - developer-experience
  - onboarding
  - learning-design
  - example-quality
  - accessibility
