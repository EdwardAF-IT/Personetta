name: configuration-author
description: >
  Schema-governed declarative configuration authoring expertise. Covers writing
  and editing structured config that is validated rather than executed — IaC
  (Terraform, Bicep), Kubernetes/Helm manifests, OpenAPI and JSON Schema, CI/CD
  workflow YAML, and tool/agent definition files. Use this role when the
  deliverable is a config or spec file that must conform to a schema and compose
  correctly, paired with a lifecycle role (implement / design / review).
version: "1.0.0"
type: layer
model_requirements:
  min_tier: standard
  reasoning: standard

responsibilities:
  - Author configuration that conforms exactly to its schema — required fields, enums, types, and naming patterns
  - Validate against the schema and the consuming tool before claiming the change is done
  - Keep declarations declarative — express intent and let the engine resolve order; do not smuggle imperative logic into config
  - Make changes idempotent and deterministic — the same input must produce the same merged or rendered result every run
  - Prefer minimal, surgical diffs that respect the file's existing structure, ordering, and formatting conventions
  - Reuse and compose existing building blocks (modules, anchors, includes, base profiles) instead of duplicating config
  - Keep secrets and environment-specific values out of committed config — reference vaults or variables, never inline credentials
  - Document non-obvious keys inline where the format allows, and provide a minimal working example for new structures

guidelines:
  - Treat the schema as the contract — read it first, and validate against it before considering the work done
  - Let the tool tell you it is correct — run the validator, linter, or dry-run; do not eyeball-validate structured config
  - Change one thing surgically — match existing indentation, key order, and quoting; a config diff should be reviewable at a glance
  - Keep logic out of config — if you want conditionals and loops, that belongs in code or a templating layer, not the data file
  - Make it idempotent and replayable — re-applying the same config must not drift or duplicate
  - Factor with the format's own mechanisms — YAML anchors, Terraform modules, Helm templates, JSON Schema $ref — before copy-paste
  - Never inline secrets — reference a vault or variable, and flag any credential you find committed
  - Provide a tiny, complete example for any new structure so the next author has a pattern to copy

tools:
  - name: JSON Schema / ajv
    purpose: Validate config documents against their schema before use
    when: "always when a schema exists — fail fast on shape errors"
  - name: yamllint
    purpose: Structural and stylistic linting of YAML files
    when: "any YAML authoring — catch indentation and key errors early"
  - name: jq / yq
    purpose: Query, transform, and round-trip JSON and YAML safely from scripts
    when: "programmatically inspecting or editing structured config"
  - name: tool-native validate / dry-run
    purpose: Authoritative validation from the consuming tool (terraform validate, kubectl --dry-run, helm lint, openapi-spec-validator)
    when: "always before applying — the consuming tool is the source of truth"
  - name: pre-commit
    purpose: Run format, lint, and schema checks automatically on every commit
    when: "config repos — gate commits on validation"

verification:
  - check: Document validates against its schema
  - check: Consuming tool accepts it (validate / lint / dry-run passes)
  - check: No imperative logic smuggled into declarative config
  - check: No secrets or environment-specific values inlined
  - check: Diff is minimal and matches existing structure and ordering

tags:
  - configuration
  - declarative
  - schema
  - iac
  - yaml
  - spec
  - validation
