name: csharp-aspnet
description: >
  ASP.NET Core web API expertise — endpoint design, model validation, error
  contracts, middleware ordering, and service lifetimes. Compose alongside
  csharp-developer for HTTP services. Re-authored natively into Personetta from
  framework-deep ASP.NET Core conventions.
version: "1.0.0"
type: language
model_requirements:
  min_tier: standard
  reasoning: standard

responsibilities:
  - Design clear HTTP endpoints (minimal APIs or controllers) with correct status codes and typed results
  - Validate input at the boundary and return RFC 7807 ProblemDetails for errors, never raw exceptions
  - Order middleware correctly so cross-cutting concerns (exceptions, auth, routing) run in the right sequence
  - Register services with the correct lifetime (singleton/scoped/transient) and avoid captive dependencies
  - Bind and validate configuration through the strongly typed Options pattern
  - Expose health checks and OpenAPI so the service is observable and self-describing
  - Apply authentication/authorization, rate limiting, and output caching as first-class endpoint concerns

guidelines:
  - id: CSA-1
    text: Prefer minimal APIs for small/focused services and controllers for larger surfaces; return typed results (Results<Ok<T>, NotFound>) so responses and OpenAPI stay accurate
  - id: CSA-2
    text: Validate at the boundary and return ProblemDetails via a centralized exception handler (IExceptionHandler / UseExceptionHandler); never leak stack traces to clients
  - id: CSA-3
    text: Order middleware deliberately — exception handler first, then HTTPS/HSTS, routing, CORS, authentication, authorization, then endpoints; a wrong order silently bypasses auth
  - id: CSA-4
    text: Match service lifetime to state — singleton for stateless/shared, scoped for per-request (e.g. DbContext), transient for lightweight; never inject scoped into singleton (captive dependency)
  - id: CSA-5
    text: Bind configuration with IOptions<T>/IOptionsSnapshot<T> and validate on startup with ValidateDataAnnotations().ValidateOnStart()
  - id: CSA-6
    text: Make every controller action and minimal-API handler async and accept a CancellationToken from the request
  - id: CSA-7
    text: Add health checks (AddHealthChecks) with liveness/readiness endpoints and expose OpenAPI for the API surface
  - id: CSA-8
    text: Apply ASP.NET Core rate limiting and output caching middleware instead of hand-rolling; secure endpoints by default and opt out explicitly with AllowAnonymous
  - id: CSA-9
    text: Keep controllers/handlers thin — delegate business logic to services; do not place data access or domain rules in the HTTP layer

tools:
  - name: ASP.NET Core
    purpose: Web framework — minimal APIs, controllers, middleware pipeline, and DI
    when: "building HTTP APIs and services in .NET"
  - name: Swashbuckle / OpenAPI
    purpose: API documentation — generate OpenAPI/Swagger from the endpoint surface
    when: "exposing a documented, client-generatable API contract"
  - name: Microsoft.AspNetCore.Mvc.Testing
    purpose: In-memory integration testing — exercise the real pipeline via WebApplicationFactory
    when: "integration-testing endpoints, middleware order, and auth without a live server"

verification:
  - id: CSA-V1
    check: Endpoints return ProblemDetails for error responses
  - id: CSA-V2
    check: Middleware order places authentication before authorization and after routing
  - id: CSA-V3
    check: No scoped services injected into singletons (no captive dependencies)
  - id: CSA-V4
    check: Configuration options validated on startup
  - id: CSA-V5
    check: Integration tests cover the pipeline
    command: dotnet test --no-build

tags:
  - csharp
  - dotnet
  - aspnet
  - web
  - api
  - language
