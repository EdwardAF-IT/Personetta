name: powershell-formatting-standards
description: >
  Edward's personal PowerShell formatting and style standards. Covers brace
  placement, parameter layout, alignment rules, string formatting, and
  conditional structure. Apply alongside the general powershell-developer
  role to enforce these conventions.
version: "1.0.0"
type: mixin
model_requirements:
  min_tier: standard
  reasoning: none

responsibilities:
  - Enforce consistent brace placement rules based on block length and conditional complexity
  - Enforce parameter formatting rules based on parameter count and name length
  - Enforce alignment of similar assignments, function calls, and multi-line expressions
  - Enforce string formatting conventions (format operator only, no interpolation)
  - Enforce comment standards for functions and inline code

guidelines:
  - Always use automated formatting and analysis tools to enforce style rules before making manual formatting corrections
  # Function structure
  - Every function must have comment-based help with at least .SYNOPSIS and .DESCRIPTION; always explicitly return a value from functions
  - "Constants in ALL_CAPS; inline comments start with a capital letter; non-trivial code must have a descriptive comment — end-of-line if short, above if longer"

  # Parameter formatting
  - "Short parameter list (few params, short names): inline — param ([int] $x, [int] $y); longer lists: open parenthesis on next line, parameters indented, each with a short inline comment"
  - Always put a space between type cast and variable name for readability — [string] $Name not [string]$Name

  # Brace placement
  - "Always use braces {} for conditionals and loops; opening brace on its own line, aligned with the keyword — never at the end of the conditional line; closing brace aligns with the opening keyword"
  - "Short conditional (<=1 comparator) + short block: inline — if ($x -eq 1) { return \"one\" }; non-short conditional (>1 comparator) + short body: body on one line below, indented; longer comparators: aligned on separate lines"
  - Apply the same brace placement rules to for, foreach, while, switch, try/catch/finally, and function definitions

  # Function calls
  - "Short calls (<4 params, fits within ~90 columns): keep on one line; long calls: break across lines with backtick continuation, indent parameters"

  # Alignment
  - Align similar assignments along the operator and parameters of consecutive similar function calls for visual consistency

  # Math expressions
  - Break long math expressions across lines, align operands for clarity

  # Strings
  - Always use -f or .Format() for string building — never use string interpolation ("$var")

  # Operators and comparisons
  - "Always put spaces around operators; prefer $var -eq $null style, not $null -eq $var"

verification:
  - check: Script passes PSScriptAnalyzer formatting rules
    command: Invoke-ScriptAnalyzer -Path . -Recurse -Settings CodeFormatting
  - check: One True Brace Style used consistently
  - check: Function comment-based help present

examples:
  - scenario: Multi-line block with compound conditional
    input: "if ($x -gt 1 -and $y -lt 5) { Write-Verbose 'Checking range'; return $x + $y }"
    output: |
      if ($x -gt 1 -and $y -lt 5)
      {
          Write-Verbose "Checking range"
          return $x + $y
      }

  - scenario: Parameter block with multiple parameters
    input: "param([string]$Name,[string]$Hex)"
    output: |
      param (
          [string] $Name,  # Display name of the color
          [string] $Hex    # Hexadecimal color string
      )

  - scenario: Aligned constant assignments
    input: "$SRGB_THRESHOLD = 0.04045; $SRGB_DIVISOR = 12.92; $SRGB_A = 0.055"
    output: |
      $SRGB_THRESHOLD = 0.04045
      $SRGB_DIVISOR   = 12.92
      $SRGB_A         = 0.055

  - scenario: Long function call
    input: "New-ColorRecord -Name 'Magenta' -Hex '#FF00FF' -Verbose"
    output: |
      New-ColorRecord `
          -Name "Magenta" `
          -Hex "#FF00FF" `
          -Verbose

  - scenario: String formatting
    input: "Write-Output \"Red: $red\""
    output: |
      Write-Output ("Red : {0}" -f $red)

tags:
  - powershell
  - formatting
  - style
  - conventions
  - mixin
