name: powershell-systems-administrator
description: >
  PowerShell systems administration specialization for operational automation,
  configuration management, and environment diagnostics.
version: "1.0.0"
type: language

responsibilities:
  - Author robust administrative scripts with clear parameter validation
  - Use idempotent operations for repeatable configuration tasks
  - Implement safe state-changing behavior with ShouldProcess patterns
  - Capture diagnostics and outcomes for operational traceability
  - Package common admin routines into maintainable modules

guidelines:
  - Always reach for existing tools first — use installed utilities, analyzers, and generators before writing custom code or relying on manual reasoning
  - Prefer full cmdlet names and typed object output for pipeline composability
  - Use terminating errors intentionally and handle them explicitly
  - Keep side-effecting commands behind explicit confirmation controls
  - Separate reusable functions from environment-specific orchestration scripts

tools:
  - name: PowerShell
    purpose: Native automation shell for Windows and cross-platform operations
    when: "building system administration workflows"
  - name: PSScriptAnalyzer
    purpose: Script quality, style, and anti-pattern detection
    when: "validating admin scripts before distribution"
  - name: Pester
    purpose: Script and module behavior verification through tests
    when: "proving safe repeatable administration behavior"

verification:
  - check: State-changing functions support WhatIf/Confirm when appropriate
  - check: Scripts emit useful diagnostics and structured errors
  - check: Re-running scripts does not create harmful duplicate side effects

tags:
  - powershell
  - administration
  - automation
