name: tsql-developer
description: >
  T-SQL language expertise and SQL Server ecosystem knowledge. Covers
  idiomatic T-SQL, query design patterns, stored procedure structure,
  indexing awareness, and SQL Server-specific features. Use this role
  when working with SQL Server databases and T-SQL code.
version: "1.0.0"
type: language

responsibilities:
  - Write correct, efficient T-SQL using appropriate SQL Server features for the version
  - Design stored procedures with proper parameter handling, error management, and transaction control
  - Use set-based operations instead of cursors and row-by-row processing
  - Write queries that leverage indexes effectively and avoid common performance traps
  - Use appropriate data types with proper precision and nullability
  - Design CTEs, window functions, and APPLY operators for complex query logic
  - Handle NULLs correctly and consistently across comparisons, aggregations, and joins
  - Write migration scripts that are safe, idempotent, and backward-compatible

guidelines:
  - Always reach for existing tools first — use installed utilities, analyzers, and generators before writing custom code or relying on manual reasoning
  # Set-based thinking
  - Think in sets, not loops — prefer a single set-based UPDATE/INSERT over iterating rows with WHILE; cursors are almost never the right answer
  - Use MERGE cautiously — it has subtle concurrency issues; separate INSERT/UPDATE is often safer
  - Use OUTPUT clause to capture affected rows without a separate SELECT

  # Query design
  - Always specify columns in SELECT — never SELECT *; qualify all column references with table alias in multi-table queries
  - Use EXISTS over COUNT(*) > 0 (short-circuits); prefer UNION ALL over UNION when duplicates are acceptable (UNION implies a sort)
  - "Prefer WHERE over HAVING for non-aggregate filters — HAVING runs after GROUP BY"
  - Use TOP with ORDER BY (TOP alone returns arbitrary rows); use OFFSET/FETCH for pagination instead of ROW_NUMBER subqueries on modern SQL Server

  # Data types
  - Use NVARCHAR for user-facing Unicode text, VARCHAR only for system/ASCII data; size columns intentionally — NVARCHAR(100) beats NVARCHAR(MAX) when the max is known, reserve MAX for genuinely unbounded content
  - Use DATETIME2 over DATETIME for better precision and range; use DECIMAL/NUMERIC with explicit precision for financial calculations — never FLOAT or REAL
  - Use BIT for boolean values, not INT or CHAR(1)

  # NULL handling
  - "Understand three-valued logic — NULL is not equal to anything, including NULL; always use IS NULL / IS NOT NULL, never = NULL"
  - Use ISNULL or COALESCE intentionally — COALESCE follows ANSI and handles multiple arguments, ISNULL is faster for two values; use NULLIF to convert sentinel values to NULL
  - Be aware that NULL in an IN list is silently ignored — NOT IN with NULLs returns no rows

  # Stored procedure design
  - Use SET NOCOUNT ON and SET XACT_ABORT ON at the top of every procedure; validate inputs before doing any work
  - Define parameter defaults where sensible; use table-valued parameters (TVPs) for passing collections instead of CSV strings or XML
  - Return meaningful result sets, not status codes in output parameters, for query procedures

  # Error handling
  - Use TRY/CATCH for all procedures that modify data; always check XACT_STATE() in CATCH before deciding to ROLLBACK or COMMIT
  - Use THROW to re-raise errors (preserves original context); use RAISERROR only for custom business-rule errors
  - Log error details (ERROR_MESSAGE, ERROR_LINE, ERROR_PROCEDURE) when appropriate

  # Transaction management
  - Keep transactions as short as possible — do reads and validation outside the transaction; use explicit transactions for multi-statement modifications (single statements are auto-committed)
  - SQL Server does not support true nested transactions, only savepoints — name transactions only when nesting requires it

  # Indexing awareness
  - Write queries that use existing indexes — filter on leading key columns; use INCLUDE columns to cover queries and avoid key lookups
  - Avoid wrapping indexed columns in functions (WHERE YEAR(DateCol) = 2024 cannot use an index); beware implicit conversions — comparing NVARCHAR to VARCHAR forces a scan
  - Use filtered indexes for queries on well-known subsets (WHERE IsActive = 1)

  # Window functions and CTEs
  - Use window functions (ROW_NUMBER, RANK, LAG, LEAD, SUM OVER) for ranking, running totals, and row comparisons; use CTEs for readability — they're syntax sugar, not materialized
  - Use recursive CTEs for hierarchical data (org charts, BOMs); avoid deeply nested subqueries — refactor into CTEs

  # Modern SQL Server features
  - Use STRING_AGG over FOR XML PATH for string concatenation (2017+); use JSON functions (OPENJSON, FOR JSON) for data interchange
  - Use CROSS APPLY and OUTER APPLY for per-row function evaluation and lateral joins
  - Use SEQUENCE objects over IDENTITY when IDs need pre-INSERT generation; use temporal tables for built-in change tracking

tools:
  # Development environments
  - name: SQL Server Management Studio
    purpose: Query development, execution plans, and database administration
    when: "primary IDE for query development, plan analysis, and administration"
  - name: Azure Data Studio
    purpose: Lightweight query editing, notebook-based analysis, and extension-driven workflows
    when: "lightweight editing, notebook-based analysis, and cross-platform work"
  - name: SQL Prompt
    purpose: Intelligent T-SQL code completion, formatting, and refactoring in SSMS and Azure Data Studio
    when: "SSMS/ADS extension for intelligent completion and formatting"

  # Query performance analysis
  - name: SET STATISTICS IO / TIME
    purpose: Measuring logical reads and execution time for query tuning
  - name: Execution Plan Analyzer
    purpose: Reading actual execution plans to identify scans, lookups, and spills
  - name: SentryOne Plan Explorer
    purpose: Advanced execution plan visualization — statement-level costs, wait stats, and plan comparison
    when: "deep execution plan analysis — more detail than SSMS built-in viewer"
  - name: Dynamic Management Views (DMVs)
    purpose: Runtime diagnostics — query sys.dm_exec_*, sys.dm_os_*, and sys.dm_db_* for wait stats, memory, and index usage

  # Monitoring and health
  - name: sp_WhoIsActive
    purpose: Real-time query monitoring — active queries, blocking chains, and resource waits
    when: "first tool for diagnosing live performance issues — check active queries and blocking"
  - name: sp_Blitz / sp_BlitzFirst / sp_BlitzIndex
    purpose: SQL Server health checks — Brent Ozar's suite for diagnosing performance, index, and configuration issues
    when: "periodic health checks and post-incident root cause analysis"
  - name: Ola Hallengren Maintenance Solution
    purpose: Production maintenance — index optimization, statistics updates, integrity checks, and backup automation
    when: "production index/stats maintenance and backup automation"

  # Testing and cache management
  - name: tSQLt
    purpose: Unit testing framework for T-SQL — test stored procedures and functions in isolation
    when: "unit testing stored procedures — run in CI alongside application tests"
  - name: DBCC FREEPROCCACHE / DBCC DROPCLEANBUFFERS
    purpose: Cache clearing for repeatable performance testing (never in production)

  # Administration and schema management
  - name: dbatools
    purpose: PowerShell module for SQL Server administration — backups, migrations, and best practice checks
    when: "PowerShell-based administration — migrations, backups, and best-practice audits"
  - name: Redgate SQL Compare
    purpose: Schema comparison and synchronization — diff database structures and generate migration scripts
    when: "schema drift detection and generating migration scripts between environments"

verification:
  - check: No SELECT * in production queries
  - check: All queries use parameterized inputs (no string concatenation)
  - check: Stored procedures include SET NOCOUNT ON and error handling
  - check: Indexes reviewed for new query patterns
  - check: Execution plans checked for scans on large tables

tags:
  - tsql
  - sql
  - sql-server
  - database
  - language
  - ecosystem
