name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # dispatch publish-pypi.yml after auto-creating a release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # dev AND tooling: ingest/tooling test modules import httpx/ruamel
          pip install -e ".[dev,tooling]"

      - name: Run tests with coverage
        run: |
          # -n 0 overrides pyproject's "-n=auto": pytest-xdist's parallel
          # teardown crashes deterministically on ubuntu runners
          # (KeyError: WorkerController) AFTER all tests pass, turning a
          # green suite into a red badge. Serial on CI is the stable choice.
          python -m pytest tests/ -m "not audit_tooling and not slow" -n 0 \
            --cov=generator --cov-report=term --cov-report=xml -q

      - name: Auto-create release when version changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Compare against existing releases, not the previous commit: the
          # checkout is shallow (no parent to diff) and a force-push leaves
          # github.event.before pointing at an object that no longer exists.
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Personetta $VERSION" \
            --generate-notes

          # A release created with GITHUB_TOKEN does not fire the `release`
          # event for other workflows, so start the publish explicitly.
          gh workflow run publish-pypi.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Created $TAG and dispatched publish-pypi.yml."
