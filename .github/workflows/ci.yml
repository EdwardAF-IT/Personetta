name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # dev AND tooling: ingest/tooling test modules import httpx/ruamel
          pip install -e ".[dev,tooling]"

      - name: Run tests with coverage
        run: |
          # -n 0 overrides pyproject's "-n=auto": pytest-xdist's parallel
          # teardown crashes deterministically on ubuntu runners
          # (KeyError: WorkerController) AFTER all tests pass, turning a
          # green suite into a red badge. Serial on CI is the stable choice.
          python -m pytest tests/ -m "not audit_tooling and not slow" -n 0 \
            --cov=generator --cov-report=term --cov-report=xml -q

      - name: Auto-create release when version changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit available; skipping auto-release."
            exit 0
          fi

          if ! git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qx "pyproject.toml"; then
            echo "pyproject.toml not changed in this push; skipping auto-release."
            exit 0
          fi

          OLD_VERSION=$(git show "$BEFORE:pyproject.toml" | python -c "import sys, tomllib; print(tomllib.loads(sys.stdin.read())['project']['version'])")
          NEW_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Detected version change: $OLD_VERSION -> $NEW_VERSION"

          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "Version unchanged; skipping auto-release."
            exit 0
          fi

          TAG="v$NEW_VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Personetta $NEW_VERSION" \
            --generate-notes
