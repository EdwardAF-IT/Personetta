name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # dev AND tooling: ingest/tooling test modules import httpx/ruamel
          pip install -e ".[dev,tooling]"

      - name: Run tests with coverage
        run: |
          # -n 0 overrides pyproject's "-n=auto": pytest-xdist's parallel
          # teardown crashes deterministically on ubuntu runners
          # (KeyError: WorkerController) AFTER all tests pass, turning a
          # green suite into a red badge. Serial on CI is the stable choice.
          python -m pytest tests/ -m "not audit_tooling and not slow" -n 0 \
            --cov=generator --cov-report=term --cov-report=xml -q
