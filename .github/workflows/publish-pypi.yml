name: Publish to PyPI

# Publishes to PyPI when a GitHub Release is published (deliberate, not on every tag).
# Uses PyPI Trusted Publishing (OIDC) -- no API token stored in secrets.
#
# ONE-TIME SETUP on pypi.org (this is NOT configured in the repo -- without it
# every run dies with `invalid-publisher`, as the v1.0.1 release did):
#   https://pypi.org/manage/project/personetta/settings/publishing/
#     Owner:            EdwardAF-IT
#     Repository name:  Personetta
#     Workflow name:    publish-pypi.yml
#     Environment name: pypi
# These must match the OIDC claims this workflow actually presents:
#   sub = repo:EdwardAF-IT/Personetta:environment:pypi
# The `environment: pypi` below is what puts `:environment:pypi` in the claim, so
# the Environment field on PyPI is required, not optional. A publisher registered
# with it blank will not match.
#
# For a brand-new project, register a "pending publisher" instead (same fields),
# under Your projects -> Publishing.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the release tag matches pyproject version
        if: github.event_name == 'release'
        run: |
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml: $PYPROJECT_VERSION   release tag: $TAG_VERSION"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: pyproject.toml=$PYPROJECT_VERSION, tag=$TAG_VERSION"
            exit 1
          fi

      - name: Packaging guards (blocks a broken release)
        run: python -m pytest tests/quality/packaging -q

      - name: Build wheel and sdist
        run: python -m build

      - name: Show package contents
        run: |
          ls -lh dist/
          python -m zipfile -l dist/*.whl

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
