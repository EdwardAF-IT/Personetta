name: Publish to PyPI

# Publishes to PyPI when a GitHub Release is published (deliberate, not on every tag).
# Uses PyPI Trusted Publishing (OIDC) -- no API token stored in secrets.
# One-time setup on pypi.org: Project -> Publishing -> add a GitHub publisher
#   (owner: edwardaf-it, repo: personetta, workflow: publish-pypi.yml, environment: pypi).
# For the very first release, register a "pending publisher" before publishing.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the release tag matches pyproject version
        if: github.event_name == 'release'
        run: |
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml: $PYPROJECT_VERSION   release tag: $TAG_VERSION"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: pyproject.toml=$PYPROJECT_VERSION, tag=$TAG_VERSION"
            exit 1
          fi

      - name: Packaging guards (blocks a broken release)
        run: python -m pytest tests/quality/packaging -q

      - name: Build wheel and sdist
        run: python -m build

      - name: Show package contents
        run: |
          ls -lh dist/
          python -m zipfile -l dist/*.whl

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
